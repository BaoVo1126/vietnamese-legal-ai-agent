[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "legal-agent-vn"
version = "0.1.0"
description = "Version-aware, grounded-or-refuse RAG agent for Vietnamese law"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "langgraph>=1.0",
    "langchain-core>=1.0",
    "qdrant-client>=1.11",
    "rank-bm25>=0.2.2",
    "openai>=1.40",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Heavy / infra-specific extras: install only on the machine that needs them.
ml = ["sentence-transformers>=3.0", "FlagEmbedding>=1.3", "torch>=2.3"]
nlp = ["underthesea>=6.8"]
kg = ["neo4j>=5.23"]
ui = ["streamlit>=1.40", "pandas>=2.0"]
tracing = ["langsmith>=0.1.100"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "httpx>=0.27", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = [
    "slow: integration tests that build the real indexes (run with: pytest -m slow)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Explicit rule set so local runs and CI always agree, regardless of ruff defaults.
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    # FastAPI's Depends()/Query() in argument defaults is the framework idiom.
    "B008",
]

[tool.ruff.lint.per-file-ignores]
# Vietnamese gazette text really does use EN DASH as a heading separator, so the
# "ambiguous character" warning is a false positive on these patterns.
"src/legal_agent/ingestion/patterns.py" = ["RUF001"]
"src/legal_agent/ingestion/metadata_extractor.py" = ["RUF001"]
# EN DASH is intentional typography in the Vietnamese UI copy.
"app/streamlit_app.py" = ["RUF001"]
# Test doubles deliberately implement protocols with terse stubs.
"tests/*" = ["B027"]
