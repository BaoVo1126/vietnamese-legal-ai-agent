services:
  qdrant:
    image: qdrant/qdrant:v1.12.1
    ports: ["6333:6333", "6334:6334"]
    volumes: ["qdrant_data:/qdrant/storage"]

  neo4j:
    image: neo4j:5.24-community
    ports: ["7474:7474", "7687:7687"]
    environment:
      NEO4J_AUTH: neo4j/legalagent
      NEO4J_PLUGINS: '["apoc"]'
    volumes: ["neo4j_data:/data"]

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args: { INSTALL_PROFILE: core }
    ports: ["8080:8080"]
    depends_on: [qdrant, neo4j]
    environment:
      APP_PROFILE: prod
      QDRANT_MODE: server
      QDRANT_URL: http://qdrant:6333
      GRAPH_BACKEND: neo4j
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: legalagent
      LLM_BACKEND: stub
      LLM_BASE_URL: http://host.docker.internal:8000/v1
      LLM_MODEL: Qwen/Qwen2.5-7B-Instruct
      EMBEDDING_BACKEND: stub
      RERANKER_BACKEND: stub
    volumes: ["processed_data:/app/data/processed"]

  ui:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args: { INSTALL_PROFILE: core }
    command: >
      streamlit run app/streamlit_app.py
      --server.port 8501 --server.address 0.0.0.0 --server.headless true
    ports: ["8501:8501"]
    depends_on: [qdrant, neo4j]
    environment:
      APP_PROFILE: prod
      QDRANT_MODE: server
      QDRANT_URL: http://qdrant:6333
      GRAPH_BACKEND: neo4j
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: legalagent
      LLM_BACKEND: stub
    volumes: ["processed_data:/app/data/processed"]

volumes:
  qdrant_data:
  neo4j_data:
  processed_data:
