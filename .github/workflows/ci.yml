name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  PYTHONIOENCODING: utf-8
  APP_PROFILE: mvp

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install ruff
      - run: ruff check src tests scripts app

  test:
    name: Unit tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev,nlp]"
      - name: Fast suite
        run: pytest -q

  integration:
    name: Integration (real indexes)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev,nlp]"
      - name: Slow suite
        run: pytest -m slow -q

  evaluate:
    name: Golden-set evaluation
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev,nlp]"
      - name: Verify gold labels against the corpus
        run: python scripts/verify_goldens.py || true
      - name: Run evaluation gate
        run: python scripts/run_eval.py --regression --diagnose-failures --fail-under 0.75
      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: data/processed/eval/
          if-no-files-found: ignore

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: legal-agent-vn:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test the image
        run: |
          docker run -d --name legal-agent -p 8080:8080 legal-agent-vn:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/live; then echo " -> alive"; exit 0; fi
            sleep 5
          done
          echo "API không khởi động được"; docker logs legal-agent; exit 1
